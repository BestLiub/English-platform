[project]
name = "english-api"
version = "0.1.0"
description = "English 本地版后端"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "trafilatura>=1.12",
  "fsrs>=4.0",
  "httpx>=0.27"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# tests/ 里没有 __init__.py，pytest 默认只会把 tests/ 加进 sys.path，
# 这里把 api/ 也加进去，测试才能 import app 包
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
